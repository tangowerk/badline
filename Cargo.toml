[workspace]
resolver = "3"
members = ["crates/badline", "crates/glyphs", "crates/vk", "xtask"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"

# C++ optimisation follows opt-level (see crates/badline/build.rs):
# 0 -> -O0 -g, 1/2 -> -O2 -g, 3 -> -O3
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
strip = true

# for gdb: everything unoptimised
[profile.gdb]
inherits = "dev"
opt-level = 0
