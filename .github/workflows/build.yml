name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    # only current rolling distributions are supported: build on current Arch Linux
    container: archlinux:base-devel
    steps:
      - name: Bootstrap (git for checkout, rustup for cargo xtask)
        run: pacman -Syu --needed --noconfirm git rustup

      - uses: actions/checkout@v4

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache SDL3
        uses: actions/cache@v4
        with:
          path: builds/sdl3
          key: sdl3-${{ hashFiles('xtask/src/sdl3.rs', 'tools/patches/sdl3-*.patch') }}-archlinux

      - name: Build tarball
        run: cargo xtask dist --deps

      - uses: actions/upload-artifact@v4
        with:
          name: badline-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: badline-linux-x86_64
          path: dist

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for $version" >&2; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --title "Badline ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
