[package]
name = "badline-vk"
version.workspace = true
description = "Vulkan renderer of Badline (ash)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ash = "0.38"
# content type hint on the SDL wl_surface (SPEC "Decisions M-Pacing2"); uses the libwayland-client of SDL
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# LUT textures of slang presets
png = "0.18"
zune-jpeg = "0.5"
